name: Distance
description: 'Distance (Distance Technologies) is a Helsinki-based frontier-tech company pioneering
  glasses-free extended reality (XR) built on computational optics and lightfield technology. Its
  systems turn transparent surfaces — vehicle windshields, aircraft canopies, and head-mounted visors
  — into intelligent heads-up displays without screens, overlays, or wearable glasses. Products include
  the Acuity visual-intelligence platform and Acuity OS for defense, the Field Operator HUD (FOH)
  head-mounted system in field trials across NATO countries, and panoramic lightfield HUDs for
  automotive ADAS and navigation. Distance is backed by GV (Google Ventures) and partners with defense,
  aerospace, and automotive organizations including Kia, Supacat, Galvion, Patria, and General Dynamics.
  The company publishes no public API or developer program; this profile tracks its identity and public
  web surface in the API Evangelist network.'
